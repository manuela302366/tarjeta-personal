<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuela Vergara | Desarrolladora en proceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-dvh bg-linear-to-b
 from-slate-950 via-sky-950 to-slate-900 text-slate-100
  flex items-center justify-center p-6 font-sans">

  <!-- Contenedor principal estilo tarjeta -->
  <main class="max-w-md w-full bg-slate-900/60 backdrop-blur-md
   border border-slate-700/50 rounded-3xl p-8 shadow-2xl text-center">
  
   <!-- Cabecera con foto difuminada -->
    <header class="flex flex-col items-center">
      <img 
        src="img/perfil.jpeg"  alt="Manuela Vergara" 
        class="w-56 h-56 object-cover object-top
         mx-auto [mask-image:radial-gradient(circle,black_45%,transparent_72%)]"
      >
      
      <!-- Nombre y etiqueta de rol -->
      <div class="-mt-6 relative z-10">
        <span class="inline-block bg-sky-500/10 border border-sky-400/30 text-sky-300 text-xs font-medium px-3 py-1 rounded-full mb-2">
          Desarrolladora en proceso
        </span>
        <h1 class="text-3xl font-bold tracking-tight text-white">
          Manuela Vergara
        </h1>
      </div>

      <!-- Datos rápidos: Ubicación y Edad -->
      <div class="flex items-center gap-3 mt-3 text-sm text-slate-300">
        <span class="bg-slate-800/80 border border-slate-700 px-3 py-1 rounded-full">
          📍 Medellín, Colombia
        </span>
        <span class="bg-slate-800/80 border border-slate-700 px-3 py-1 rounded-full">
          🎂 26 años
        </span>
      </div>
    </header>

    <!-- Separador sutil -->
    <hr class="border-slate-800 my-6">

    <!-- Sección Sobre mí -->
    <section id="about" class="space-y-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-sky-400">
        Sobre mí
      </h2>
      <p class="text-sm text-slate-300 leading-relaxed">
        ¡Hola! Soy Manuela, tengo 26 años y vivo en Medellín. Actualmente estoy aprendiendo desarrollo web
         y construyendo mis primeros proyectos.
      </p>
    </section>

    <!-- Sección Contacto -->
    <section id="contact" class="mt-8">
   <a 
  href="mailto:manuela3023666@gmail.com" 
  class="inline-flex items-center justify-center gap-2 w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-sky-500/20"
>
        <span>✉️</span>
        <span>Escríbeme a mi correo</span>
      </a>
      <p class="text-xs text-slate-400 mt-3 select-all">
        manuela3023666@gmail.com
      </p>
    </section>

  </main>

</body>
</html>
